<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B8A2B" id="meta-couleur">
<title>Korum</title>
<link rel="icon" href="data:," id="favicon">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#0B8A2B; --accent-fonce:color-mix(in srgb,var(--accent) 78%,#000); --accent-pale:color-mix(in srgb,var(--accent) 10%,#fff); --accent-bord:color-mix(in srgb,var(--accent) 25%,#fff);
  --texte:#0f1923; --gris:#4a5568; --gris-pale:#6b7a8c;
  --ligne:rgba(27,45,66,.12); --ligne-champ:rgba(27,45,66,.22); --fond:#f5f5f0; --blanc:#ffffff;
  --focus:color-mix(in srgb,var(--accent) 35%,transparent);
  --titre:"DM Serif Display",Georgia,serif;
  --rouge:#b3261e; --rouge-pale:#fbe9e7;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:var(--texte);
  font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--ligne);background:var(--blanc);border-radius:var(--r);padding:9px 14px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn-p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn-p:active{background:var(--accent-fonce)}
.btn-v{border-color:var(--accent);color:var(--accent);font-weight:600;background:var(--blanc)}
.btn-d{border-color:var(--rouge);color:var(--rouge);background:var(--blanc)}
.btn-s{padding:6px 11px;font-size:14px}
a.btn-p,a.btn-v{display:inline-block;border:1px solid;border-radius:var(--r);padding:9px 14px;text-decoration:none}
a.btn-p.btn-s,a.btn-v.btn-s{padding:6px 11px}
.btn-w{width:100%}
button[disabled]{opacity:.5;cursor:default}
input[type=text],input[type=email],input[type=date],input[type=time],input[type=url],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--ligne-champ);border-radius:var(--r);background:var(--blanc);font-size:16px}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:14px;font-weight:500;color:var(--texte);margin:12px 0 4px}
label:first-child{margin-top:0}
a{color:var(--accent)}
h1{font-family:var(--titre);font-size:24px;font-weight:400;letter-spacing:-.01em;margin:0}
h2{font-size:14px;font-weight:500;color:var(--gris);margin:18px 0 8px}
h2:first-child{margin-top:0}
p{margin:0}
.m0{margin:0}
.muet{color:var(--gris);font-size:14px}
.petit{font-size:13px;color:var(--gris-pale)}
.appli{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.entete{position:sticky;top:0;z-index:5;background:var(--fond);padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.entete .js-logo,.entete .js-logo > *{width:30px;height:30px}
.entete .titre{display:flex;align-items:center;gap:10px}
.contenu{padding:0 16px 96px;flex:1}
.barre{position:fixed;bottom:0;left:0;right:0;background:var(--blanc);border-top:1px solid var(--ligne);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
.barre-int{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.onglet{border:0;background:none;border-radius:0;padding:10px 4px 8px;font-size:12px;color:var(--gris);display:flex;flex-direction:column;align-items:center;gap:2px}
.onglet svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.onglet.actif{color:var(--accent);font-weight:600}
.carte{background:var(--blanc);border:1px solid var(--ligne);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.carte.accent{border:2px solid var(--accent)}
.carte.fini{color:var(--gris-pale)}
.ligne{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ligne > div:first-child{min-width:0;flex:1}
.titre-t{font-size:15px;margin:0}
.meta{font-size:13px;color:var(--gris-pale);margin-top:3px}
.meta .point{vertical-align:1px;margin-right:5px}
.point{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.puces{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.puce{font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--ligne);background:var(--blanc);color:var(--gris)}
.puce.actif{background:var(--accent);border-color:var(--accent);color:#fff}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.vide{text-align:center;color:var(--gris);padding:32px 12px;font-size:15px}
.vide strong{display:block;color:var(--texte);font-weight:600;margin-bottom:4px}
.mois{font-weight:600;font-size:15px;margin:16px 0 6px}
.evt{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--ligne)}
.evt .jour{text-align:center;min-width:40px}
.evt .jour .n{font-size:20px;font-weight:600;line-height:1.1}
.evt .jour .j{font-size:11px;color:var(--gris-pale)}
.odj{margin:6px 0 0;padding:0;list-style:none}
.odj li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--ligne);font-size:15px}
.odj li:first-child{border-top:0}
.odj .n{color:var(--gris-pale);margin-right:6px}
.sous{border:1px solid var(--ligne);border-radius:var(--r);padding:7px 10px;margin-top:6px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.annonce{background:var(--accent-pale);border:1px solid var(--accent-bord);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.annonce .meta{color:var(--accent-fonce)}
.voile{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--blanc);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px 28px}
.modal h1{font-size:18px;margin-bottom:10px}
.modal .pied{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.erreur{color:var(--rouge);font-size:14px;margin-top:8px}
.aide{font-size:13px;color:var(--gris);background:var(--blanc);border:1px dashed var(--ligne);border-radius:var(--r);padding:8px 12px;margin-bottom:12px}
.connexion{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;max-width:420px;margin:0 auto;text-align:center}
.connexion .js-logo{display:block;margin:0 auto 18px}
.connexion .js-logo,.connexion .js-logo > *{width:110px;height:110px}
.js-logo{display:block;flex:none}
.js-logo img,.logo-apercu img{display:block;border-radius:50%;object-fit:contain;background:#fff;border:1px solid var(--ligne)}
.pastille{display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--accent);color:#fff;font-weight:600;flex:none}
.entete .pastille{width:30px;height:30px;font-size:12px}
.connexion .pastille{font-size:38px;letter-spacing:1px}
.logo-apercu,.logo-apercu > *{width:64px;height:64px;flex:none}
.logo-apercu .pastille{font-size:22px}
.apercu{display:flex;align-items:center;gap:14px;padding:12px;border:1px dashed var(--ligne);border-radius:12px;margin-bottom:6px}
.fichier-cache{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.btn-fichier{display:inline-block;margin:0;border:1px solid var(--accent);border-radius:var(--r);cursor:pointer;color:var(--accent);font-weight:600;padding:6px 11px;font-size:14px;background:var(--blanc)}
.fichier-cache:focus-visible + .actions .btn-fichier{outline:3px solid var(--focus);outline-offset:2px}
.nuancier{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nuance{width:34px;height:34px;border-radius:50%;padding:0;border:2px solid transparent}
.nuance.actif{border-color:var(--texte);box-shadow:inset 0 0 0 2px #fff}
input[type=color]{width:44px;height:34px;padding:2px;border:1px solid var(--ligne);border-radius:var(--r);background:var(--blanc)}
.connexion h1{font-size:42px;letter-spacing:-.02em;line-height:1.1}
.connexion .sous-titre{color:var(--gris);margin:6px 0 28px;font-size:15px}
.connexion button{width:100%;margin-bottom:10px;padding:13px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--texte);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--ligne);vertical-align:top}
th{font-weight:500;color:var(--gris)}
.cache{display:none !important}
.bandeau-demo{background:#0f1923;color:#fff;font-size:13px;text-align:center;padding:8px 16px;line-height:1.4}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="bandeau-demo" class="bandeau-demo cache">Mode démonstration : données fictives, rien n'est enregistré. Collez la configuration Firebase pour l'utiliser pour vrai.</div>

<div id="ecran-connexion" class="connexion cache">
  <span class="js-logo"></span>
  <h1>Korum</h1>
  <p class="sous-titre" id="sous-titre-connexion"></p>
  <button class="btn-p" id="btn-google">Continuer avec Google</button>
  <details style="text-align:left;margin-top:8px">
    <summary class="muet" style="cursor:pointer">Pas de compte Google ?</summary>
    <label>Votre courriel</label>
    <input type="email" id="courriel-lien" placeholder="nom@exemple.ca" autocomplete="email">
    <button class="btn-v" id="btn-lien" style="margin-top:10px">Recevoir un lien de connexion</button>
  </details>
  <p class="erreur" id="err-connexion"></p>
  <p class="petit" style="margin-top:24px" id="mention-acces"></p>
</div>

<div id="ecran-refus" class="connexion cache">
  <span class="js-logo"></span>
  <h1>Accès non autorisé</h1>
  <p class="sous-titre" id="refus-texte"></p>
  <button class="btn-v" onclick="window.__deco()">Se déconnecter</button>
</div>

<div id="appli" class="appli cache">
  <header class="entete">
    <div class="titre"><span class="js-logo"></span><h1 id="titre-onglet">Tâches</h1></div>
    <button class="btn-s" id="btn-moi"></button>
  </header>
  <main class="contenu" id="contenu"></main>
  <nav class="barre" aria-label="Sections">
    <div class="barre-int">
      <button class="onglet actif" data-onglet="taches"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Tâches</button>
      <button class="onglet" data-onglet="rencontres"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1M15 14h1a4 4 0 0 1 4 4v2"/></svg>Rencontres</button>
      <button class="onglet" data-onglet="calendrier"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16"/></svg>Calendrier</button>
      <button class="onglet" data-onglet="documents"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 2h8a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/></svg>Documents</button>
    </div>
  </nav>
</div>

<div id="modal-racine"></div>
<div class="toast" id="toast"></div>

<script type="module">

/* ====== 1. CONFIGURATION FIREBASE — projet korum-ccmrc (Chambre de commerce de la MRC de La Matapédia) (console Firebase > Paramètres du projet > Vos applications) ====== */
const firebaseConfig = {
  apiKey: "AIzaSyBn2Enc0oYcDGKUsrtVZkcA9s-qpTBypmg",
  authDomain: "korum-ccmrc.firebaseapp.com",
  projectId: "korum-ccmrc",
  storageBucket: "korum-ccmrc.firebasestorage.app",
  messagingSenderId: "870494667762",
  appId: "1:870494667762:web:8bb72609e41aadb35e216b"
};
/* ================================================================================================== */

/* ====== 2. VALEURS DE DÉPART — rien à modifier ici. Le nom, la couleur et le logo se changent dans l'app : menu > Réglages > Identité ====== */
const DEPART = {
  nom: "Mon organisme",
  deNom: "de l'organisme",
  instance: "Conseil d'administration",
  couleur: "#2F5D8A",
  contactAcces: "la personne qui gère l'outil",
  logo: "",
  etiquettes: [ { nom:"Conseil", couleur:"#1B5EA6", type:"comite" } ],
  odj: ["Ouverture de la réunion","Lecture et adoption de l'ordre du jour","Adoption du procès-verbal de la dernière réunion","Suivi des finances","Correspondance","Varia","Prochaine rencontre","Levée de la réunion"]
};
const FUSEAU = "America/Toronto";
const RAPPEL = "Les tâches ici sont celles du conseil et des comités. La gestion quotidienne reste à la direction.";
/* ================================================================================================== */

const DEMO = String(firebaseConfig.apiKey).startsWith("À_REMPLACER") || new URLSearchParams(location.search).has("demo");
const CHAMPS_ID = ["nom","deNom","instance","couleur","contactAcces","logo"];
let ID = { ...DEPART };
try{ if(!DEMO) ID = { ...ID, ...JSON.parse(localStorage.getItem("korum-identite")||"{}") }; }catch(e){}
function initiales(nom){ return (nom||"").split(/[\s'’-]+/).filter(m => m.length > 2 && !/^(des|du|la|le|les|et|pour|sur|aux)$/i.test(m)).slice(0,2).map(m => m[0].toUpperCase()).join("") || "Q"; }
function htmlLogo(id){ return id.logo && /^data:image\//.test(id.logo) ? `<img src="${id.logo}" alt="">` : `<div class="pastille" aria-hidden="true">${initiales(id.nom).replace(/[<>&"]/g,"")}</div>`; }
function appliquerIdentite(id){
  const couleur = /^#[0-9a-f]{6}$/i.test(id.couleur||"") ? id.couleur : DEPART.couleur;
  document.documentElement.style.setProperty("--accent", couleur);
  document.getElementById("meta-couleur").content = couleur;
  document.getElementById("favicon").href = (id.logo && /^data:image\//.test(id.logo)) ? id.logo : "data:,";
  document.querySelectorAll(".js-logo").forEach(el => el.innerHTML = htmlLogo(id));
  document.title = "Korum — " + id.nom;
  const e = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  document.getElementById("sous-titre-connexion").innerHTML = `${e(id.instance)}<br>${e(id.nom)}`;
  document.getElementById("mention-acces").textContent = `Accès réservé aux membres et à l'équipe ${id.deNom}.`;
}
appliquerIdentite(ID);
const V = "https://www.gstatic.com/firebasejs/10.12.2/";
let F;
if(DEMO) F = korumDemo();
else {
  try{ F = Object.assign({}, ...(await Promise.all(["firebase-app.js","firebase-auth.js","firebase-firestore.js"].map(f => import(V + f))))); }
  catch(e){
    document.getElementById("ecran-connexion").classList.remove("cache");
    document.getElementById("btn-google").disabled = true;
    document.getElementById("err-connexion").textContent = "Impossible de joindre Firebase. Vérifiez la connexion Internet, puis rechargez la page.";
    throw e;
  }
}
const { initializeApp, getAuth, onAuthStateChanged, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider,
  sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink, signOut,
  getFirestore, collection, doc, onSnapshot, addDoc, setDoc, updateDoc, deleteDoc, getDoc, getDocs, query, where, orderBy, serverTimestamp, writeBatch } = F;
if(DEMO) document.getElementById("bandeau-demo").classList.remove("cache");
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onSnapshot(doc(db,"config","public"), s => {
  const d = s.exists() ? s.data() : {};
  ID = { ...DEPART };
  CHAMPS_ID.forEach(k => { if(d[k] !== undefined && d[k] !== null) ID[k] = d[k]; });
  try{ if(!DEMO) localStorage.setItem("korum-identite", JSON.stringify(ID)); }catch(e){}
  appliquerIdentite(ID);
  if(S.membre) rendre();
}, e => console.warn("identité", e.message));

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const ROLES = { admin:"Admin", gestion:"Gestion", executif:"Exécutif", membre:"Membre" };
const NIVEAU = { admin:4, gestion:3, executif:2, membre:1 };
const STATUTS = [["a_faire","À faire"],["en_cours","En cours"],["termine","Terminé"]];
const COULEURS = ["#1B5EA6","#F5A800","#E1261C","#8DC63F","#3EB7B0","#7B3F98","#C0296F","#0B8A2B"];
const ODJ_DEFAUT = DEPART.odj;
const CONFIG_DEFAUT = { lienDocuments:"", lienSoumission:"", etiquettes:DEPART.etiquettes, odjModele:ODJ_DEFAUT };

const S = {
  user:null, membre:null, config:CONFIG_DEFAUT,
  taches:[], rencontres:[], calendrier:[], annonces:[], ressources:[], membres:[],
  onglet:"taches", filtre:"tous", vueAdmin:null, subs:[]
};
const moi = () => S.membre?.courriel || "";
const niv = () => NIVEAU[S.membre?.role] || 0;
const estAdmin = () => niv() >= 4, estGestion = () => niv() >= 3, estExecutif = () => niv() >= 2;
const nomDe = c => (S.membres.find(m => m.courriel === c)?.nom) || c || "";
const etq = n => S.config.etiquettes.find(e => e.nom === n) || { nom:n, couleur:"#9a9a9a" };
const aujourdhui = () => new Date().toISOString().slice(0,10);

const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const JOURS = ["dim","lun","mar","mer","jeu","ven","sam"];
const MOIS_COURT = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
function fmtDate(iso, court){ if(!iso) return ""; const [a,m,j] = iso.split("-").map(Number); const d = new Date(a,m-1,j);
  return court ? `${j} ${MOIS_COURT[m-1]}` : `${JOURS[d.getDay()]} ${j} ${MOIS[m-1]} ${a}`; }
function fmtHeure(h){ return h ? h.replace(":"," h ") : ""; }
function toast(t){ const e=$("#toast"); e.textContent=t; e.classList.add("on"); setTimeout(()=>e.classList.remove("on"),2200); }

/* ---------- Authentification ---------- */
const actionCodeSettings = { url: location.href.split("#")[0], handleCodeInApp:true };
$("#btn-google").onclick = () => connecter(new GoogleAuthProvider());
$("#btn-lien").onclick = async () => {
  const c = $("#courriel-lien").value.trim().toLowerCase();
  if(!c){ $("#err-connexion").textContent = "Entrez votre courriel."; return; }
  try{ await sendSignInLinkToEmail(auth, c, actionCodeSettings); localStorage.setItem("korum-courriel", c);
    $("#err-connexion").textContent = ""; toast("Lien envoyé. Ouvrez votre courriel."); }
  catch(e){ $("#err-connexion").textContent = "Envoi impossible : " + e.message; }
};
async function connecter(p){
  $("#err-connexion").textContent = "";
  try{ await signInWithPopup(auth, p); }
  catch(e){
    if(/popup|blocked|cancelled/i.test(e.code||"")){ try{ await signInWithRedirect(auth,p); }catch(e2){ $("#err-connexion").textContent = e2.message; } }
    else $("#err-connexion").textContent = "Connexion impossible : " + e.message;
  }
}
window.__deco = () => signOut(auth);
(async () => {
  try{ await getRedirectResult(auth); }catch(e){}
  if(isSignInWithEmailLink(auth, location.href)){
    let c = localStorage.getItem("korum-courriel") || prompt("Confirmez votre courriel");
    try{ await signInWithEmailLink(auth, c, location.href); history.replaceState(null,"",location.pathname); }catch(e){ alert("Lien invalide ou expiré."); }
  }
})();

onAuthStateChanged(auth, async user => {
  S.subs.forEach(u=>u()); S.subs=[];
  S.user = user; S.membre = null;
  if(!user){ montrer("connexion"); return; }
  const courriel = (user.email||"").toLowerCase();
  let snap; try{ snap = await getDoc(doc(db,"membres",courriel)); }catch(e){ snap = null; }
  if(!snap || !snap.exists() || snap.data().actif === false){
    $("#refus-texte").innerHTML = `Le compte <strong>${esc(courriel)}</strong> n'est pas dans la liste des administrateurs.<br>Contactez ${esc(ID.contactAcces)} pour l'ajouter.`;
    montrer("refus"); return;
  }
  S.membre = { courriel, ...snap.data() };
  montrer("appli"); abonner(); rendre();
});
function montrer(q){ ["connexion","refus"].forEach(k=>$("#ecran-"+k).classList.toggle("cache", q!==k)); $("#appli").classList.toggle("cache", q!=="appli"); }

/* ---------- Données en temps réel ---------- */
function abonner(){
  const ecouter = (q, cle, tri) => S.subs.push(onSnapshot(q, s => { S[cle] = s.docs.map(d=>({id:d.id, ...d.data()})); if(tri) S[cle].sort(tri); rendre(); },
    e => console.warn(cle, e.message)));
  ecouter(collection(db,"taches"), "taches", (a,b)=> (a.echeance||"9999").localeCompare(b.echeance||"9999") || (a.titre||"").localeCompare(b.titre||""));
  ecouter(collection(db,"rencontres"), "rencontres", (a,b)=> (b.date||"").localeCompare(a.date||""));
  ecouter(collection(db,"calendrier"), "calendrier", (a,b)=> (a.date||"").localeCompare(b.date||"") || (a.heure||"").localeCompare(b.heure||""));
  ecouter(collection(db,"annonces"), "annonces", (a,b)=> (b.epingle?1:0)-(a.epingle?1:0) || (b.date?.seconds||0)-(a.date?.seconds||0));
  ecouter(collection(db,"ressources"), "ressources", (a,b)=> (a.ordre||0)-(b.ordre||0));
  ecouter(collection(db,"membres"), "membres", (a,b)=> (a.nom||"").localeCompare(b.nom||""));
  S.subs.push(onSnapshot(doc(db,"config","general"), s => { S.config = { ...CONFIG_DEFAUT, ...(s.exists()? s.data():{}) }; if(!S.config.etiquettes?.length) S.config.etiquettes = CONFIG_DEFAUT.etiquettes; rendre(); }));
}
// Les membres sont indexés par courriel (id du document)
const membresListe = () => S.membres.map(m => ({ ...m, courriel:m.id }));

/* ---------- Archivage automatique (session admin) ---------- */
let archiveFait = false;
async function archiverVieillesTaches(){
  if(!estAdmin() || archiveFait) return; archiveFait = true;
  const limite = Date.now() - 30*86400000;
  const lot = writeBatch(db); let n=0;
  S.taches.forEach(t => { if(t.statut==="termine" && !t.archive && t.termineLe?.seconds && t.termineLe.seconds*1000 < limite){ lot.update(doc(db,"taches",t.id), { archive:true }); n++; } });
  if(n){ await lot.commit(); }
}

/* ---------- Navigation ---------- */
$$(".onglet").forEach(b => b.onclick = () => { S.onglet = b.dataset.onglet; S.vueAdmin = null; S.filtre = "tous"; S.brouillonId = null; rendre(); window.scrollTo(0,0); });
$("#btn-moi").onclick = () => menuMoi();

function rendre(){
  if(!S.membre) return;
  S.membres = membresListe();
  archiverVieillesTaches();
  $$(".onglet").forEach(b => b.classList.toggle("actif", b.dataset.onglet === S.onglet && !S.vueAdmin));
  $("#btn-moi").textContent = (S.membre.nom || S.membre.courriel).split(" ")[0];
  const titres = { taches:"Tâches", rencontres:"Rencontres", calendrier:"Calendrier", documents:"Documents", historique:"Historique", membres:"Membres", reglages:"Réglages" };
  $("#titre-onglet").textContent = titres[S.vueAdmin || S.onglet];
  const actif = document.activeElement;
  if(actif && $("#contenu").contains(actif) && /^(INPUT|TEXTAREA|SELECT)$/.test(actif.tagName) && actif.type !== "file"){ S.renduEnAttente = true; return; }
  S.renduEnAttente = false;
  const vue = S.vueAdmin || S.onglet;
  const r = { taches:vueTaches, rencontres:vueRencontres, calendrier:vueCalendrier, documents:vueDocuments, historique:vueHistorique, membres:vueMembres, reglages:vueReglages }[vue];
  $("#contenu").innerHTML = r();
  lier();
  if(vue === "reglages") lierIdentite();
}
function lier(){ $$("[data-act]").forEach(el => el.onclick = e => { e.preventDefault(); ACTIONS[el.dataset.act]?.(el.dataset, el); }); }

/* ---------- Mode démonstration : imite Firebase en mémoire ---------- */
function korumDemo(){
  const store = new Map(), ecoutes = new Set(), abonnes = new Set();
  const clone = o => o === undefined ? undefined : JSON.parse(JSON.stringify(o));
  const parent = p => p.split("/").slice(0,-1).join("/");
  const idNeuf = () => Math.random().toString(36).slice(2,12);
  const maintenant = () => ({ seconds: Math.floor(Date.now()/1000) });
  const val = v => (v && v.seconds !== undefined) ? v.seconds : (v ?? "");
  function snapCol(ref){
    const docs = [...store.entries()].filter(([p]) => parent(p) === ref.path).map(([p,d]) => ({ id:p.split("/").pop(), data:() => clone(d) }));
    (ref.tri||[]).forEach(([c,s]) => docs.sort((a,b) => { const x = val(a.data()[c]), y = val(b.data()[c]); return (x>y?1:x<y?-1:0) * (s==="desc"?-1:1); }));
    return { docs };
  }
  function snapDoc(ref){ const d = store.get(ref.path); return { id:ref.id, exists:() => d !== undefined, data:() => clone(d) }; }
  const snap = ref => ref.type === "col" ? snapCol(ref) : snapDoc(ref);
  const avertir = () => ecoutes.forEach(e => setTimeout(() => e.cb(snap(e.ref)), 0));
  let utilisateur = null;
  const changer = u => { utilisateur = u; abonnes.forEach(cb => setTimeout(() => cb(u), 0)); };

  // Données fictives, datées par rapport à aujourd'hui
  const jour = n => { const d = new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
  const moi = "vous@demo.korum";
  const set = (p, d) => store.set(p, d);
  set("config/public", { nom:"Association exemple de la Vallée", deNom:"de l'Association", instance:"Conseil d'administration", couleur:"#2F5D8A", contactAcces:"la personne qui gère l'outil", logo:"" });
  set("config/general", { lienDocuments:"", lienSoumission:"kihosq-soumission.html",
    etiquettes:[{nom:"CA",couleur:"#1B5EA6",type:"comite"},{nom:"Événements",couleur:"#F5A800",type:"comite"},{nom:"Financement",couleur:"#8DC63F",type:"dossier"}],
    odjModele:DEPART.odj });
  set("membres/"+moi, { nom:"Vous", role:"admin", actif:true });
  set("membres/marie@demo.korum", { nom:"Marie Tremblay", titre:"Directrice générale", role:"gestion", actif:true, codeLuLe:jour(-60), declarationAnnee:new Date().getFullYear() });
  set("membres/luc@demo.korum", { nom:"Luc Gagnon", titre:"Trésorier", role:"executif", actif:true, codeLuLe:jour(-90) });
  set("membres/sophie@demo.korum", { nom:"Sophie Bélanger", role:"membre", actif:true });
  const odj = ["Ouverture de la réunion","Lecture et adoption de l'ordre du jour","Adoption du procès-verbal de la dernière réunion","Budget de l'an prochain","Gala annuel","Suivi des finances","Correspondance","Varia","Prochaine rencontre","Levée de la réunion"];
  set("rencontres/r1", { type:"CA", date:jour(12), heure:"18:30", lieu:"Salle du conseil", ordreDuJour:odj, lienPV:"" });
  set("rencontres/r0", { type:"CA", date:jour(-18), heure:"18:30", lieu:"Salle du conseil", ordreDuJour:odj.slice(0,4), lienPV:"https://example.com/pv" });
  set("calendrier/renc_r1", { date:jour(12), heure:"18:30", titre:"CA", type:"rencontre", etiquette:"CA", lieu:"Salle du conseil", rencontreId:"r1" });
  set("calendrier/e1", { date:jour(24), heure:"17:00", titre:"5 à 7 des membres", type:"evenement", lieu:"Bistro du centre-ville" });
  set("calendrier/e2", { date:jour(52), heure:"18:00", titre:"Gala annuel", type:"evenement", lieu:"Grande salle municipale" });
  const t = (id, d) => set("taches/"+id, { archive:false, nbCommentaires:0, rencontreId:"", pointOdj:"", creePar:"marie@demo.korum", description:"", echeance:"", ...d });
  t("t1", { titre:"Trouver un traiteur pour le Gala", etiquette:"Événements", statut:"a_faire", responsable:"", description:"Environ 120 personnes, cocktail dînatoire.", rencontreId:"r0", pointOdj:"Gala annuel" });
  t("t2", { titre:"Préparer le budget de l'an prochain", etiquette:"Financement", statut:"a_faire", responsable:moi, echeance:jour(9) });
  t("t3", { titre:"Réserver la salle pour le 5 à 7", etiquette:"Événements", statut:"en_cours", responsable:"luc@demo.korum", echeance:jour(5), nbCommentaires:1 });
  t("t4", { titre:"Envoyer les convocations de l'assemblée", etiquette:"CA", statut:"termine", responsable:"marie@demo.korum", termineLe:maintenant() });
  t("t5", { titre:"Mettre à jour la liste des partenaires", etiquette:"CA", statut:"a_faire", responsable:"sophie@demo.korum", echeance:jour(20) });
  set("taches/t3/commentaires/c1", { texte:"J'ai appelé le bistro, ils nous rappellent jeudi.", auteur:"luc@demo.korum", auteurNom:"Luc Gagnon", date:maintenant() });
  set("annonces/a1", { texte:"Les photos du dernier événement sont dans le dossier partagé.", auteur:"marie@demo.korum", auteurNom:"Marie Tremblay", date:maintenant(), epingle:false });
  set("ressources/d1", { titre:"Code d'éthique de l'administrateur", description:"À lire avant votre première rencontre", lien:"https://example.com/code-ethique", pour:"tous", ordre:1, accuse:true });
  set("ressources/d2", { titre:"Guide de l'administrateur", lien:"https://example.com/guide", pour:"tous", ordre:2, accuse:false });

  return {
    initializeApp:() => ({}), getAuth:() => ({}), getFirestore:() => ({}),
    collection:(db, ...s) => ({ type:"col", path:s.join("/") }),
    doc:(db, ...s) => ({ type:"doc", path:s.join("/"), id:s[s.length-1] }),
    query:(ref, ...c) => ({ ...ref, tri:c.filter(x => x && x.tri).map(x => x.tri) }),
    where:() => ({}), orderBy:(champ, sens="asc") => ({ tri:[champ, sens] }),
    serverTimestamp:() => maintenant(),
    onSnapshot:(ref, cb) => { const e = { ref, cb }; ecoutes.add(e); setTimeout(() => cb(snap(ref)), 0); return () => ecoutes.delete(e); },
    getDoc:async ref => snapDoc(ref), getDocs:async ref => snapCol(ref),
    addDoc:async (ref, d) => { const id = idNeuf(); store.set(ref.path+"/"+id, clone(d)); avertir(); return { id }; },
    setDoc:async (ref, d, o) => { store.set(ref.path, o?.merge ? { ...(store.get(ref.path)||{}), ...clone(d) } : clone(d)); avertir(); },
    updateDoc:async (ref, d) => { if(!store.has(ref.path)) throw new Error("introuvable"); store.set(ref.path, { ...store.get(ref.path), ...clone(d) }); avertir(); },
    deleteDoc:async ref => { store.delete(ref.path); avertir(); },
    writeBatch:() => { const ops = []; return { update:(r, d) => ops.push(() => store.set(r.path, { ...store.get(r.path), ...clone(d) })), commit:async () => { ops.forEach(f => f()); avertir(); } }; },
    onAuthStateChanged:(a, cb) => { abonnes.add(cb); setTimeout(() => cb(utilisateur), 0); return () => abonnes.delete(cb); },
    signInWithPopup:async () => changer({ email:moi }), signInWithRedirect:async () => changer({ email:moi }),
    getRedirectResult:async () => null, GoogleAuthProvider:class {},
    sendSignInLinkToEmail:async () => { throw new Error("pas disponible en démonstration"); },
    isSignInWithEmailLink:() => false, signInWithEmailLink:async () => {}, signOut:async () => changer(null)
  };
}

/* ---------- Lien vers l'outil de soumission (optionnel) ---------- */
function lienSoumission(o){
  const base = S.config.lienSoumission; if(!base) return "";
  let u; try{ u = new URL(base, location.href); }catch(e){ return ""; }
  if(!/^(https?|file):$/.test(u.protocol)) return "";
  const p = { source:"korum", nom:o.nom, date:o.date, lieu:o.lieu, debut:o.debut, details:o.details,
              org:[S.membre?.nom, ID.nom].filter(Boolean).join(" — "), email:moi() };
  Object.entries(p).forEach(([k,v]) => { if(v) u.searchParams.set(k, v); });
  return u.toString();
}
function boutonSoumission(o){
  const l = lienSoumission(o);
  return l ? `<a class="btn-v btn-s" href="${esc(l)}" target="_blank" rel="noopener">Demander des soumissions</a>` : "";
}

/* ---------- Vue : Tâches ---------- */
function carteTache(t, opts={}){
  const e = etq(t.etiquette); const mienne = t.responsable === moi();
  const boutons = [];
  if(t.statut !== "termine"){
    if(!t.responsable) boutons.push(`<button class="btn-v btn-s" data-act="prendre" data-id="${t.id}">Je prends</button>`);
    else if(mienne) boutons.push(`<button class="btn-s" data-act="retirer" data-id="${t.id}">Je me retire</button>`);
    if(mienne || estExecutif()){
      if(t.statut==="a_faire") boutons.push(`<button class="btn-s" data-act="statut" data-id="${t.id}" data-s="en_cours">Commencer</button>`);
      boutons.push(`<button class="btn-v btn-s" data-act="statut" data-id="${t.id}" data-s="termine">Terminé</button>`);
    }
  } else if(estExecutif()) boutons.push(`<button class="btn-s" data-act="statut" data-id="${t.id}" data-s="en_cours">Rouvrir</button>`);
  const nbCom = t.nbCommentaires ? ` · ${t.nbCommentaires} commentaire${t.nbCommentaires>1?"s":""}` : "";
  const renc = t.rencontreId ? S.rencontres.find(r=>r.id===t.rencontreId) : null;
  return `<div class="carte ${t.statut==="termine"?"fini":""}">
    <div class="ligne">
      <div>
        <p class="titre-t">${esc(t.titre)}</p>
        <p class="meta"><span class="point" style="background:${e.couleur}"></span>${esc(t.etiquette||"")}${t.responsable? " · "+esc(nomDe(t.responsable)) : " · personne"}${t.echeance? " · pour le "+fmtDate(t.echeance,true):""}${nbCom}</p>
        ${renc && !opts.sansRenc ? `<p class="petit">Issue de : ${esc(renc.type)} du ${fmtDate(renc.date,true)}</p>`:""}
      </div>
      <button class="btn-s" data-act="ouvrir-tache" data-id="${t.id}" aria-label="Détails">Détails</button>
    </div>
    ${boutons.length? `<div class="actions">${boutons.join("")}</div>`:""}
  </div>`;
}
function vueTaches(){
  const actives = S.taches.filter(t => !t.archive);
  const f = S.filtre;
  const filtrees = actives.filter(t => f==="tous" ? true : f==="moi" ? t.responsable===moi() : t.etiquette===f);
  const cols = STATUTS.map(([s,l]) => [l, filtrees.filter(t=>t.statut===s)]);
  const puces = [["tous","Toutes"],["moi","Mes tâches"], ...S.config.etiquettes.map(e=>[e.nom,e.nom])]
    .map(([v,l]) => `<button class="puce ${f===v?"actif":""}" data-act="filtre" data-v="${esc(v)}">${esc(l)}</button>`).join("");
  const annonces = S.annonces.slice(0,3).map(a => `<div class="annonce">
      <p>${esc(a.texte)}</p>
      <p class="meta">${esc(a.auteurNom||nomDe(a.auteur))} · ${a.date?.seconds? fmtDate(new Date(a.date.seconds*1000).toISOString().slice(0,10),true):""}
      ${(a.auteur===moi()||estExecutif())? ` · <a href="#" data-act="suppr-annonce" data-id="${a.id}">retirer</a>`:""}</p></div>`).join("");
  return `
    <div class="ligne" style="margin-bottom:12px">
      <p class="muet">${actives.filter(t=>t.statut!=="termine").length} tâche(s) ouverte(s)</p>
      ${estExecutif()? `<button class="btn-p btn-s" data-act="nouvelle-tache">+ Ajouter</button>`:""}
    </div>
    ${annonces || ""}
    <div style="margin-bottom:14px"><button class="btn-s" data-act="nouvelle-annonce">Publier une annonce</button>
      ${S.annonces.length>3? ` <button class="btn-s" data-act="toutes-annonces">Toutes les annonces (${S.annonces.length})</button>`:""}</div>
    <div class="puces">${puces}</div>
    ${filtrees.length===0 ? `<div class="vide"><strong>Aucune tâche ici</strong>${estExecutif()? "Ajoutez la première ou changez de filtre.":"Rien à faire pour le moment."}</div>` :
      cols.map(([l,ts]) => ts.length ? `<h2>${l} (${ts.length})</h2>${ts.map(t=>carteTache(t)).join("")}` : "").join("")}
    <p class="aide" style="margin-top:20px">${esc(RAPPEL)}</p>`;
}

/* ---------- Vue : Rencontres ---------- */
function vueRencontres(){
  const auj = aujourdhui();
  const aVenir = S.rencontres.filter(r => r.date >= auj).sort((a,b)=>a.date.localeCompare(b.date));
  const passees = S.rencontres.filter(r => r.date < auj);
  const bloc = (r, accent) => {
    const e = etq(r.type); const ts = S.taches.filter(t=>t.rencontreId===r.id && !t.archive);
    const odj = (r.ordreDuJour||[]).map((p,i) => `<li><span><span class="n">${i+1}.</span>${esc(p)}</span>
      ${estExecutif()? `<button class="btn-s" data-act="nouvelle-tache" data-renc="${r.id}" data-point="${esc(p)}" aria-label="Ajouter une tâche au point ${i+1}">+ tâche</button>`:""}</li>`).join("");
    return `<div class="carte ${accent?"accent":""}">
      <p class="titre-t"><span class="point" style="background:${e.couleur};margin-right:6px"></span><strong>${esc(r.type)}</strong> – ${fmtDate(r.date)}${r.heure? ", "+fmtHeure(r.heure):""}</p>
      <p class="meta">${esc(r.lieu||"")}</p>
      ${accent ? `<h2>Ordre du jour</h2><ol class="odj">${odj || "<li class='muet'>Pas encore d'ordre du jour</li>"}</ol>` : ""}
      ${accent && ts.length ? `<h2>Tâches liées</h2>${ts.map(t=>`<div class="sous"><span>${esc(t.titre)}</span><span class="muet">${esc(nomDe(t.responsable))||"personne"} · ${STATUTS.find(s=>s[0]===t.statut)?.[1]||""}</span></div>`).join("")}`:""}
      ${!accent ? `<p class="petit">${ts.length} tâche(s) · ${ts.filter(t=>t.statut==="termine").length} terminée(s)</p>`:""}
      <div class="actions">
        ${r.lienPV ? `<a class="btn-v btn-s" style="text-decoration:none;display:inline-block" href="${esc(r.lienPV)}" target="_blank" rel="noopener">Voir le PV</a>` : `<span class="muet" style="padding:6px 0">Pas de PV</span>`}
        ${!accent ? `<button class="btn-s" data-act="ouvrir-rencontre" data-id="${r.id}">Ordre du jour et tâches</button>`:""}
        ${estGestion()? `<button class="btn-s" data-act="modif-rencontre" data-id="${r.id}">Modifier</button>`:""}
      </div></div>`;
  };
  return `
    <div class="ligne" style="margin-bottom:12px"><p class="muet">Environ une rencontre par mois, plus l'AGA.</p>
      ${estGestion()? `<button class="btn-p btn-s" data-act="nouvelle-rencontre">+ Nouvelle</button>`:""}</div>
    <h2>À venir</h2>
    ${aVenir.length ? aVenir.map((r,i)=>bloc(r, i===0)).join("") : `<div class="vide"><strong>Aucune rencontre planifiée</strong>${estGestion()?"Créez la prochaine.":"La direction annoncera la prochaine date."}</div>`}
    ${passees.length ? `<h2>Passées</h2>${passees.slice(0,24).map(r=>bloc(r,false)).join("")}`:""}`;
}

/* ---------- Vue : Calendrier ---------- */
function vueCalendrier(){
  const auj = aujourdhui();
  const f = S.filtre==="rencontre"||S.filtre==="evenement" ? S.filtre : "tout";
  const items = S.calendrier.filter(c => c.date >= auj && (f==="tout" || c.type===f));
  const groupes = {};
  items.forEach(c => { const k = c.date.slice(0,7); (groupes[k] ||= []).push(c); });
  const html = Object.keys(groupes).sort().map(k => { const [a,m] = k.split("-");
    return `<p class="mois">${MOIS[+m-1][0].toUpperCase()+MOIS[+m-1].slice(1)} ${a}</p>` + groupes[k].map(c => {
      const [,,j] = c.date.split("-").map(Number); const d = new Date(+a,+m-1,j); const e = c.type==="rencontre" ? etq(c.etiquette||"CA") : null;
      return `<div class="evt"><div class="jour"><div class="j">${JOURS[d.getDay()]}</div><div class="n">${j}</div></div>
        <div style="flex:1;min-width:0"><p class="titre-t">${e? `<span class="point" style="background:${e.couleur};margin-right:6px"></span>`:""}${esc(c.titre)}</p>
          <p class="meta">${c.heure? fmtHeure(c.heure):""}${c.lieu? " · "+esc(c.lieu):""}</p>
          <div class="actions" style="margin-top:6px"><button class="btn-s" data-act="ics" data-id="${c.id}">Ajouter à mon calendrier</button>
          ${c.type==="evenement" ? boutonSoumission({ nom:c.titre, date:c.date, lieu:c.lieu, debut:c.heure }) : ""}
          ${estGestion() && c.type==="evenement"? `<button class="btn-s" data-act="modif-evenement" data-id="${c.id}">Modifier</button>`:""}</div></div></div>`; }).join(""); }).join("");
  return `
    <div class="ligne" style="margin-bottom:12px"><p class="muet">Rencontres et événements à venir.</p>
      ${estGestion()? `<button class="btn-p btn-s" data-act="nouvel-evenement">+ Événement</button>`:""}</div>
    <div class="puces">${[["tout","Tout"],["rencontre","Rencontres"],["evenement","Événements"]].map(([v,l])=>`<button class="puce ${f===v?"actif":""}" data-act="filtre" data-v="${v}">${l}</button>`).join("")}</div>
    ${html || `<div class="vide"><strong>Rien à l'horaire</strong>Les rencontres créées apparaissent ici automatiquement.</div>`}`;
}

/* ---------- Vue : Documents ---------- */
function vueDocuments(){

      ${estGestion()? `<div class="actions"><button class="btn-s" data-act="modif-ressource" data-id="${r.id}">Modifier</button></div>`:""}

function contraste(hex){
  const lum = x => { const v = parseInt(x,16)/255; return v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); };
  const m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex||""); if(!m) return 0;
  const L = .2126*lum(m[1]) + .7152*lum(m[2]) + .0722*lum(m[3]);
  return 1.05 / (L + .05);
}
function avisCouleur(c){ const k = contraste(c); return k < 3 ? "Couleur trop pâle : le texte blanc des boutons serait illisible. Choisissez plus foncé." : k < 4 ? "Couleur un peu pâle : le texte blanc des boutons sera moins lisible." : ""; }

async function preparerLogo(fichier){
  if(!fichier || !/^image\//.test(fichier.type)) throw new Error("Choisissez une image (PNG, JPG ou SVG).");
  const url = URL.createObjectURL(fichier);
  try{
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error("Cette image n'a pas pu être lue.")); i.src = url; });
    const w0 = img.naturalWidth || 256, h0 = img.naturalHeight || 256, r = Math.min(1, 256 / Math.max(w0, h0));
    const w = Math.max(1, Math.round(w0*r)), hh = Math.max(1, Math.round(h0*r));
    const c = document.createElement("canvas"); c.width = w; c.height = hh;
    c.getContext("2d").drawImage(img, 0, 0, w, hh);
    let data = c.toDataURL("image/png");
    if(data.length > 150000){
      const g = c.getContext("2d"); g.globalCompositeOperation = "destination-over"; g.fillStyle = "#fff"; g.fillRect(0,0,w,hh);
      data = c.toDataURL("image/jpeg", .85);
    }
    if(data.length > 300000) throw new Error("Image trop lourde, même réduite. Essayez une version plus simple du logo.");
    return data;
  } finally { URL.revokeObjectURL(url); }
}

    <label>Ordre d'affichage</label><input type="text" id="f-ordre" value="${esc(r.ordre??10)}" inputmode="numeric">
    <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="f-acc" style="width:auto" ${r.accuse?"checked":""}> Demander un accusé de lecture (code d'éthique)</label>
    <p class="erreur" id="f-err"></p>
    ${pied("Enregistrer", r.id? `<button class="btn-d" data-act="suppr-ressource" data-id="${r.id}">Supprimer</button>`:"")}`);
  onOk = async () => { const titre=$("#f-titre").value.trim(), lien=$("#f-lien").value.trim();
    if(!titre||!lien){ $("#f-err").textContent="Titre et lien sont obligatoires."; return; }
    const data = { titre, description:$("#f-desc").value.trim(), lien, pour:$("#f-pour").value, ordre:+$("#f-ordre").value||10, accuse:$("#f-acc").checked };
    if(r.id) await updateDoc(doc(db,"ressources",r.id), data); else await addDoc(collection(db,"ressources"), data);
    fermer(); toast("Document enregistré"); };
}
function formMembre(m={}){
  modal(`<h1>${m.courriel? "Modifier l'accès":"Ajouter une personne"}</h1>
    <label>Courriel (celui de son compte Google, ou l'adresse où recevoir le lien de connexion)</label><input type="email" id="f-courriel" value="${esc(m.courriel||"")}" ${m.courriel?"disabled":""} placeholder="nom@exemple.ca">
    <label>Nom</label><input type="text" id="f-nom" value="${esc(m.nom||"")}">
    <label>Titre (facultatif)</label><input type="text" id="f-titre" value="${esc(m.titre||"")}" placeholder="Ex. : Présidente, Directrice générale, Trésorier, Secrétaire">
    <label>Rôle (niveau d'accès)</label><select id="f-role">${Object.entries(ROLES).map(([v,l])=>`<option value="${v}" ${(m.role||"membre")===v?"selected":""}>${l}</option>`).join("")}</select>
    <p class="petit">Membre : prend des tâches, commente, publie des annonces. Exécutif : crée et assigne les tâches. Gestion : rencontres, calendrier, documents. Admin : membres et historique.</p>
    <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="f-actif" style="width:auto" ${m.actif===false?"":"checked"}> Accès actif</label>
    <label>Déclaration d'intérêts reçue pour</label><input type="text" id="f-decl" value="${esc(m.declarationAnnee||"")}" inputmode="numeric" placeholder="Ex. : ${new Date().getFullYear()}">
    <p class="erreur" id="f-err"></p>
    ${pied()}`);
  onOk = async () => { const courriel=(m.courriel||$("#f-courriel").value).trim().toLowerCase(); const nom=$("#f-nom").value.trim();
    if(!courriel.includes("@")||!nom){ $("#f-err").textContent="Courriel et nom sont obligatoires."; return; }
    const data = { nom, titre:$("#f-titre").value.trim(), role:$("#f-role").value, actif:$("#f-actif").checked, declarationAnnee:+$("#f-decl").value||null };
    await setDoc(doc(db,"membres",courriel), data, { merge:true });
    fermer(); toast("Accès enregistré"); };
}
function menuMoi(){
  const m = S.membre;
  modal(`<h1>${esc(m.nom||m.courriel)}</h1><p class="muet">${m.titre?esc(m.titre)+" · ":""}${esc(m.courriel)} · ${ROLES[m.role]}</p>
    <div class="actions" style="flex-direction:column;align-items:stretch;margin-top:16px">
      ${estGestion()? `<button data-act="vue" data-v="membres">Membres et déclarations d'intérêts</button>`:""}
      ${estGestion()? `<button data-act="vue" data-v="reglages">Réglages (nom, couleur, logo, étiquettes, ordre du jour)</button>`:""}
      ${estAdmin()? `<button data-act="vue" data-v="historique">Historique des tâches archivées</button>`:""}
      <button class="btn-d" data-act="deco">Se déconnecter</button>
    </div><div class="pied"><button data-act="fermer">Fermer</button></div>`);
}

/* ---------- Actions ---------- */
function ics(c){
  const dt = c.date.replace(/-/g,""); const h = (c.heure||"").replace(":","");
  const debut = h ? `DTSTART;TZID=${FUSEAU}:${dt}T${h}00` : `DTSTART;VALUE=DATE:${dt}`;
  const fin = h ? `DTEND;TZID=${FUSEAU}:${dt}T${String(+h.slice(0,2)+2).padStart(2,"0")}${h.slice(2)}00` : `DTEND;VALUE=DATE:${dt}`;
  const txt = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Korum//FR","BEGIN:VEVENT",`UID:${c.id}@korum`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").slice(0,15)}Z`,debut,fin,`SUMMARY:${c.titre} – ${ID.nom}`,`LOCATION:${c.lieu||""}`,"END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a"); a.href = "data:text/calendar;charset=utf-8,"+encodeURIComponent(txt); a.download = `${c.titre.replace(/\W+/g,"-")}-${c.date}.ics`; a.click();
}
const ACTIONS = {
  fermer: () => fermer(),
  ok: () => onOk && onOk().catch(e => { const z=$("#f-err"); if(z) z.textContent = "Enregistrement refusé : " + e.message; else toast("Erreur : "+e.message); }),
  filtre: d => { S.filtre = d.v; rendre(); },
  vue: d => { fermer(); S.vueAdmin = d.v; S.filtre="tout"; S.brouillonId = null; rendre(); },
  deco: () => signOut(auth),
  "nouvelle-tache": d => formTache({}, d.renc||"", d.point||""),
  "modif-tache": d => { fermer(); formTache(S.taches.find(t=>t.id===d.id)); },
  "ouvrir-tache": d => detailTache(d.id),
  prendre: d => updateDoc(doc(db,"taches",d.id), { responsable:moi(), modifieLe:serverTimestamp() }).then(()=>toast("C'est à vous")).catch(e=>toast("Refusé : "+e.message)),
  retirer: d => updateDoc(doc(db,"taches",d.id), { responsable:"", modifieLe:serverTimestamp() }).catch(e=>toast("Refusé : "+e.message)),
  statut: d => updateDoc(doc(db,"taches",d.id), { statut:d.s, modifieLe:serverTimestamp(), termineLe: d.s==="termine" ? serverTimestamp() : null }).then(()=>toast(d.s==="termine"?"Terminé":"Statut changé")).catch(e=>toast("Refusé : "+e.message)),
  "suppr-tache": async d => { if(!confirm("Supprimer cette tâche ?")) return; await deleteDoc(doc(db,"taches",d.id)); fermer(); toast("Tâche supprimée"); },
  "suppr-com": async d => { await deleteDoc(doc(db,"taches",d.id,"commentaires",d.c)); detailTache(d.id); },
  "nouvelle-annonce": () => formAnnonce(),
  "suppr-annonce": d => deleteDoc(doc(db,"annonces",d.id)).catch(e=>toast("Refusé : "+e.message)),
  "toutes-annonces": () => modal(`<h1>Annonces</h1>${S.annonces.map(a=>`<div class="annonce"><p>${esc(a.texte)}</p><p class="meta">${esc(a.auteurNom||nomDe(a.auteur))}${(a.auteur===moi()||estExecutif())? ` · <a href="#" data-act="suppr-annonce" data-id="${a.id}">retirer</a>`:""}</p></div>`).join("")}<div class="pied"><button data-act="fermer">Fermer</button></div>`),
  "nouvelle-rencontre": () => formRencontre(),
  "modif-rencontre": d => formRencontre(S.rencontres.find(r=>r.id===d.id)),
  "ouvrir-rencontre": d => { const r=S.rencontres.find(x=>x.id===d.id); const ts=S.taches.filter(t=>t.rencontreId===r.id);
    modal(`<h1>${esc(r.type)} – ${fmtDate(r.date)}</h1><h2>Ordre du jour</h2><ol class="odj">${(r.ordreDuJour||[]).map((p,i)=>`<li><span><span class="n">${i+1}.</span>${esc(p)}</span></li>`).join("")}</ol>
      <h2>Tâches issues (${ts.length})</h2>${ts.map(t=>carteTache(t,{sansRenc:true})).join("")||"<p class='muet'>Aucune.</p>"}<div class="pied"><button data-act="fermer">Fermer</button></div>`); },
  "suppr-rencontre": async d => { if(!confirm("Supprimer cette rencontre ? Les tâches liées restent.")) return; await deleteDoc(doc(db,"rencontres",d.id)); await deleteDoc(doc(db,"calendrier","renc_"+d.id)).catch(()=>{}); fermer(); toast("Rencontre supprimée"); },
  "nouvel-evenement": () => formEvenement(),
  "modif-evenement": d => formEvenement(S.calendrier.find(c=>c.id===d.id)),
  "suppr-evenement": async d => { if(!confirm("Supprimer cet événement ?")) return; await deleteDoc(doc(db,"calendrier",d.id)); fermer(); toast("Événement supprimé"); },
  ics: d => ics(S.calendrier.find(c=>c.id===d.id)),
  "modif-ressource": d => formRessource(d.id? S.ressources.find(r=>r.id===d.id) : {}),
  "suppr-ressource": async d => { if(!confirm("Retirer ce document de la liste ? Le fichier reste dans le dossier partagé.")) return; await deleteDoc(doc(db,"ressources",d.id)); fermer(); toast("Document retiré"); },
  "accuse-lecture": async () => { await updateDoc(doc(db,"membres",moi()), { codeLuLe:aujourdhui() }); S.membre.codeLuLe = aujourdhui(); toast("Merci, c'est noté"); rendre(); },
  "modif-membre": d => formMembre(d.id? S.membres.find(m=>m.courriel===d.id) : {}),
  declaration: d => updateDoc(doc(db,"membres",d.id), { declarationAnnee:new Date().getFullYear() }).then(()=>toast("Déclaration notée")).catch(e=>toast("Refusé : "+e.message)),
  nuance: d => { S.brouillonId.couleur = d.c; rendre(); },
  "retirer-logo": () => { S.brouillonId.logo = ""; rendre(); },
  "annuler-identite": () => { S.brouillonId = { ...ID }; rendre(); },
  "sauver-identite": async () => {
    const b = S.brouillonId, err = $("#err-id");
    const propre = {}; CHAMPS_ID.forEach(k => propre[k] = String(b[k] ?? "").trim());
    propre.logo = b.logo || "";
    if(!propre.nom){ err.textContent = "Le nom de l'organisme est obligatoire."; return; }
    if(!propre.deNom){ err.textContent = "Écrivez le nom dans une phrase, avec « de » (ex. : de la Chambre)."; return; }
    if(!propre.instance) propre.instance = DEPART.instance;
    if(!propre.contactAcces) propre.contactAcces = DEPART.contactAcces;
    if(contraste(propre.couleur) < 3){ err.textContent = "Choisissez une couleur plus foncée avant d'enregistrer."; return; }
    try{ await setDoc(doc(db,"config","public"), propre); S.brouillonId = { ...propre }; toast("Identité enregistrée"); }
    catch(e){ err.textContent = "Enregistrement refusé : " + e.message; }
  },
  "sauver-soumission": () => {
    const v = $("#reg-soum").value.trim();
    if(v && !/^https:\/\//.test(v)){ $("#err-soum").textContent = "Le lien doit commencer par https://"; return; }
    setDoc(doc(db,"config","general"), { lienSoumission:v }, { merge:true }).then(()=>toast(v? "Bouton activé":"Bouton retiré"));
  },
  "sauver-lien": () => setDoc(doc(db,"config","general"), { lienDocuments:$("#reg-lien").value.trim() }, { merge:true }).then(()=>toast("Lien enregistré")),
  "sauver-odj": () => setDoc(doc(db,"config","general"), { odjModele:$("#reg-odj").value.split("\n").map(s=>s.trim()).filter(Boolean) }, { merge:true }).then(()=>toast("Modèle enregistré")),
  "ajout-etiquette": () => { const nom=$("#etq-nom").value.trim(); if(!nom) return;
    setDoc(doc(db,"config","general"), { etiquettes:[...S.config.etiquettes, { nom, type:$("#etq-type").value, couleur:$("#etq-couleur").value }] }, { merge:true }).then(()=>toast("Étiquette ajoutée")); },
  "suppr-etiquette": d => { if(!confirm("Retirer cette étiquette ? Les tâches existantes la gardent.")) return;
    setDoc(doc(db,"config","general"), { etiquettes:S.config.etiquettes.filter((_,i)=>i!==+d.i) }, { merge:true }); },
  csv: () => { const lignes=[["Titre","Étiquette","Responsable","Statut","Échéance","Terminé le","Créé par"]];
    S.taches.filter(t=>t.archive).forEach(t=>lignes.push([t.titre,t.etiquette,nomDe(t.responsable),t.statut,t.echeance||"",t.termineLe?.seconds? new Date(t.termineLe.seconds*1000).toISOString().slice(0,10):"",nomDe(t.creePar)]));
    const csv = "\uFEFF"+lignes.map(l=>l.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")).join("\r\n");
    const a=document.createElement("a"); a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv); a.download=`korum-historique-${aujourdhui()}.csv`; a.click(); }
};
document.addEventListener("keydown", e => { if(e.key==="Escape") fermer(); });
</script>
